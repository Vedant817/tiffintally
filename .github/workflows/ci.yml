name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check code formatting
        run: uv run ruff format --check .

      - name: Run tests
        env:
          # Tests must not reach a hosted model either.
          EXTRACTOR_BACKEND: "off"
          TIFFINTALLY_TELEMETRY: "0"
        run: uv run pytest -v --durations=10

      - name: Verify no secret leakage
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_COMMENTS: false

  # A passing test suite is not enough: the eval harness must not be able to
  # rewrite the hand-written RESULTS.md, which is the file judges read.
  no-results-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv python install 3.11
      - run: uv sync --all-extras --dev
      # The step name must be quoted. An unquoted scalar starting with a
      # backtick is a YAML reserved indicator, so yaml.safe_load raised and
      # GitHub ran zero jobs for three pushes in a row.
      - name: "tiffintally eval must leave RESULTS.md untouched"
        env:
          # CI must never call a hosted model. The live endpoint took 7m12s for
          # this step and spent GPU credit on every push.
          EXTRACTOR_BACKEND: "off"
          TIFFINTALLY_TELEMETRY: "0"
        run: |
          uv run tiffintally eval
          if ! git diff --exit-code -- RESULTS.md; then
            echo "::error::tiffintally eval rewrote RESULTS.md. That file is hand-written from saved runs."
            exit 1
          fi
