name: CI

env:
  EXTRACTOR_BACKEND: "off"
  TIFFINTALLY_TELEMETRY: "0"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # gitleaks-action needs to read pull requests when the event is pull_request,
  # and refuses to run without it.
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check code formatting
        run: uv run ruff format --check .

      - name: Run tests
        env:
          # Tests must not reach a hosted model either.
          EXTRACTOR_BACKEND: "off"
          TIFFINTALLY_TELEMETRY: "0"
        run: uv run pytest -v --durations=10

      - name: Audit regression probes
        run: uv run pytest tests/probes -v

      - name: Registered numerical claims
        run: uv run python scripts/check_claims.py

      - name: Known leakage must not change silently
        run: uv run python scripts/leakage_report.py --check-known

      - name: Saved predictions must rescore identically
        run: uv run python scripts/compare.py evals/final/regex/test.jsonl evals/final/regex/test.jsonl

      - name: Daily sheet and ledger invariant
        run: |
          for seed in 0 1 42 271; do
            uv run pytest tests/test_daily_invariants.py --hypothesis-seed="$seed" -q
          done

      - name: Verify no secret leakage
        uses: gitleaks/gitleaks-action@v2
        env:
          # Since gitleaks-action v2 requires a token to scan a pull request.
          # Without it every pull_request run failed at this step, which meant no PR
          # in this repository could ever reach a green check.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_COMMENTS: false

  # Routine offline evaluation never rewrites the separately generated public table.
  no-results-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv python install 3.11
      - run: uv sync --all-extras --dev
      # The step name must be quoted. An unquoted scalar starting with a
      # backtick is a YAML reserved indicator, so yaml.safe_load raised and
      # GitHub ran zero jobs for three pushes in a row.
      - name: "tiffintally eval must leave RESULTS.md untouched"
        env:
          # CI must never call a hosted model. The live endpoint took 7m12s for
          # this step and spent GPU credit on every push.
          EXTRACTOR_BACKEND: "off"
          TIFFINTALLY_TELEMETRY: "0"
        run: |
          uv run tiffintally eval --out evals/final/ci-offline
          if ! git diff --exit-code -- RESULTS.md; then
            echo "::error::tiffintally eval rewrote the published saved-prediction table."
            exit 1
          fi
