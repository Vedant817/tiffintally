name: PR Preview

# Creates a real, isolated deployment of the pull request's own code and reports it to
# GitHub as a deployment. Automated PR testing (TestSprite) listens for this event.
#
# Why this exists instead of a platform "preview" button: the Render free tier does not
# include pull-request previews, so the preview service is managed through the Render
# API from CI. Each open PR gets its own service and its own URL, and the service is
# removed again when the PR closes.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  RENDER_API: https://api.render.com/v1

jobs:
  preview:
    # Drafts are excluded so a half-finished branch does not consume a preview service.
    if: github.event.action != 'closed' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Resolve or create preview service
        id: service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          WORKSPACE_ID: ${{ vars.RENDER_WORKSPACE_ID }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          name="tiffintally-pr-${PR}"
          list=$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" "$RENDER_API/services?limit=100")
          # Each element is {"cursor": ..., "service": {...}} — the fields are nested,
          # not flat. Reading them flat raises KeyError and the job dies in the first step.
          id=$(echo "$list" | python3 -c "import json,sys;print(next((s['service']['id'] for s in json.load(sys.stdin) if s['service']['name']=='$name'),''))")

          payload=$(python3 - "$WORKSPACE_ID" "$name" "$BRANCH" <<'PY'
          import json, os, sys
          workspace, name, branch = sys.argv[1], sys.argv[2], sys.argv[3]
          print(json.dumps({
              "ownerId": workspace,
              "name": name,
              "type": "web_service",
              "repo": "https://github.com/" + os.environ["GITHUB_REPOSITORY"],
              "branch": branch,
              "runtime": "python",
              "region": "oregon",
              "autoDeployTrigger": "commit",
              "serviceDetails": {
                  "env": "python",
                  # plan belongs here, not at the top level. A top-level "plan" is
                  # ignored and the service lands on a paid default instead of free.
                  "plan": "free",
                  "envSpecificDetails": {
                      "buildCommand": "pip install uv && uv sync --frozen --no-dev",
                      "startCommand": ".venv/bin/uvicorn tiffintally.app:app --host 0.0.0.0 --port $PORT",
                  },
                  "healthCheckPath": "",
              },
          }))
          PY
          )

          if [ -z "$id" ]; then
            echo "Creating preview service $name"
            resp=$(curl -sS -X POST "$RENDER_API/services" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$payload")
            id=$(echo "$resp" | python3 -c 'import json,sys;print(json.load(sys.stdin)["service"]["id"])')
          else
            echo "Reusing preview service $name ($id) for new commits on $BRANCH"
            curl -sS -X PATCH "$RENDER_API/services/$id" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$payload" >/dev/null
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Apply environment variables
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE: ${{ steps.service.outputs.id }}
        run: |
          set -euo pipefail
          # Set after creation, not in the create payload: env vars in the create body
          # are accepted and then silently dropped, which would leave the preview
          # without demo mode and with persistence available.
          vars=$(cat <<'JSON'
          [{"key":"PYTHON_VERSION","value":"3.11.17"},
           {"key":"TIFFINTALLY_DEMO_MODE","value":"true"},
           {"key":"TIFFINTALLY_PERSIST","value":"0"},
           {"key":"TIFFINTALLY_TELEMETRY","value":"0"},
           {"key":"GEMMA_MODEL","value":"gemma-4-26b-a4b-it"}]
          JSON
          )
          curl -sS -o /dev/null -X PUT "$RENDER_API/services/$SERVICE/env-vars" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$vars"

      - name: Confirm demo mode is actually in effect
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE: ${{ steps.service.outputs.id }}
        run: |
          set -euo pipefail
          # A preview that silently lost demo mode would write sessions to disk on a
          # public host. Verify rather than assume.
          got=$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" \
            "$RENDER_API/services/$SERVICE/env-vars" |
            python3 -c 'import json,sys;print(",".join(sorted(v["envVar"]["key"]+"="+v["envVar"]["value"] for v in json.load(sys.stdin))))')
          echo "env vars: $got"
          for required in TIFFINTALLY_DEMO_MODE=true TIFFINTALLY_PERSIST=0; do
            case ",$got," in
              *",$required,"*) ;;
              *) echo "::error::preview is missing $required; refusing to publish it"; exit 1 ;;
            esac
          done

      - name: Create GitHub deployment record
        id: ghdeploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVICE: ${{ steps.service.outputs.id }}
        run: |
          set -euo pipefail
          payload=$(python3 - "${{ github.event.pull_request.number }}" "${{ github.head_ref }}" "${{ github.event.pull_request.head.sha }}" "$SERVICE" <<'PY'
          import json, sys
          number, ref, sha, service = sys.argv[1:5]
          print(json.dumps({
              "ref": ref,
              "sha": sha,
              "environment": f"pr-{number}",
              "auto_merge": False,
              "required_contexts": [],
              "payload": {"service_id": service, "preview": "true"},
          }))
          PY
          )
          response=$(curl -sS -X POST "$GITHUB_API_URL/repos/${{ github.repository }}/deployments" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "$payload")
          # GITHUB_OUTPUT needs key=value. Writing the bare id fails the step with
          # "Invalid format" even though the deployment was created correctly.
          echo "response=$response"
          id=$(echo "$response" |
            python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Deploy and wait for the preview to go live
        id: live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE: ${{ steps.service.outputs.id }}
        run: |
          set -euo pipefail
          curl -sS -X POST "$RENDER_API/services/$SERVICE/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" >/dev/null
          # url is appended only once the deployment is genuinely live, so a failed
          # wait leaves no url key at all rather than an empty one.
          for i in $(seq 1 60); do
            sleep 10
            status=$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" \
              "$RENDER_API/services/$SERVICE/deploys?limit=1" |
              python3 -c 'import json,sys;d=json.load(sys.stdin);print(d[0]["deploy"]["status"] if d else "none")')
            echo "poll $i: $status"
            if [ "$status" = "live" ]; then
              # The API is not consistent about this: GET /v1/services/{id} returns
              # the service flat, while GET /v1/services returns it nested under a
              # "service" key. Accept either so this does not depend on which one.
              curl -sS -H "Authorization: Bearer $RENDER_API_KEY" "$RENDER_API/services/$SERVICE" |
                python3 -c 'import json,sys;d=json.load(sys.stdin);d=d.get("service",d);print("url="+d["serviceDetails"]["url"])' >> "$GITHUB_OUTPUT"
              break
            fi
            if [ "$status" = "build_failed" ] || [ "$status" = "update_failed" ] || [ "$status" = "canceled" ]; then
              echo "::error::preview deploy reached terminal status '$status'"
              exit 1
            fi
          done
          if ! grep -q '^url=https' "$GITHUB_OUTPUT"; then
            echo "::error::preview did not go live in time"
            exit 1
          fi

      - name: Wait until the preview actually responds
        env:
          URL: ${{ steps.live.outputs.url }}
        run: |
          set -euo pipefail
          # A free instance idles out and takes ~30s to accept its first request, so
          # "live" is not yet "reachable". Poll the real endpoint.
          for i in $(seq 1 30); do
            if code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$URL/health" || true); then
              echo "poll $i: /health -> $code"
              if [ "$code" = "200" ]; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::preview never returned 200 on /health"
          exit 1

      - name: Mark the GitHub deployment active with the preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.live.outputs.url }}
        run: |
          set -euo pipefail
          curl -sS -o /dev/null -X POST \
            "$GITHUB_API_URL/repos/${{ github.repository }}/deployments/${{ steps.ghdeploy.outputs.id }}/statuses" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "{\"state\":\"active\",\"environment_url\":\"$URL\",\"auto_inactive\":false}"

      - name: Comment the preview URL on the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.live.outputs.url }}
        run: |
          set -euo pipefail
          marker='<!-- preview-deployment -->'
          body=$(printf '### Preview deployment for this PR\n\n%s\n\n\n<sub>%s</sub>' "$URL" "$marker")
          ids=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --paginate -q ".[] | select(.body | contains(\"$marker\")) | .id")
          if [ -n "$ids" ]; then
            echo "$ids" | head -n1 | while read -r id; do
              gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -f body="$body" >/dev/null
            done
            echo "$ids" | tail -n +2 | while read -r id; do
              [ -n "$id" ] && gh api -X DELETE "repos/${{ github.repository }}/issues/comments/$id" >/dev/null
            done
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              -f body="$body" >/dev/null
          fi

  teardown:
    # Free-tier service slots are limited, so a closed PR must give its service back.
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Remove the preview service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          name="tiffintally-pr-${PR}"
          id=$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" "$RENDER_API/services?limit=100" |
            python3 -c "import json,sys;print(next((s['service']['id'] for s in json.load(sys.stdin) if s['service']['name']=='$name'),''))")
          if [ -z "$id" ]; then
            echo "No preview service for PR #$PR"
            exit 0
          fi
          echo "Deleting preview service $name ($id)"
          curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $RENDER_API_KEY" "$RENDER_API/services/$id"