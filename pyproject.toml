[project]
name = "tiffintally"
version = "0.1.0"
description = "Your WhatsApp tiffin orders, sorted before the pressure cooker's first whistle."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.30.0,<1",
    "pydantic>=2.9.0,<3",
    "jinja2>=3.1.4,<4",
    "python-multipart>=0.0.12,<0.1",
    "httpx>=0.27.0,<0.29",
    "python-dotenv>=1.0.1,<2",
    "typer>=0.12.5,<1",
    "rich>=13.8.0,<16",
    "numpy>=1.26.0,<3",
    "modal>=1.6.1,<2",
    "sentry-sdk>=2.72.0,<3",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100,<7",
    "pytest>=8.3.0,<10",
    "pytest-asyncio>=0.24.0,<2",
    "ruff>=0.6.8,<1",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100,<7",
    "pytest>=8.3.0,<10",
    "pytest-asyncio>=0.24.0,<2",
    "ruff>=0.6.8,<1",
]

[project.scripts]
tiffintally = "tiffintally.cli:app"

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiffintally"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
