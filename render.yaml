services:
  - type: web
    name: tiffintally
    runtime: python
    region: oregon
    plan: free
    buildCommand: uv sync
    startCommand: uv run uvicorn tiffintally.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.17
      # Demo mode keeps persistence off, so a public instance writes nothing to disk.
      - key: TIFFINTALLY_DEMO_MODE
        value: "true"
      # off = rules only, nothing leaves the server. gemini = hosted Gemma.
      - key: EXTRACTOR_BACKEND
        sync: false
      # Only read when EXTRACTOR_BACKEND is gemini. Leave it unset for a rules-only demo.
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMMA_MODEL
        value: "gemma-4-26b-a4b-it"
